name: Build XR30 Firmware

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "OpenWrt 源码仓库地址"
        required: false
        default: "https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git"
      source_ref:
        description: "源码分支或标签"
        required: false
        default: "25.12"
  push:
    branches: [main]
    paths:
      - "config/**"
      - ".github/workflows/**"
  schedule:
    - cron: "0 18 * * 5"

concurrency:
  group: build-xr30-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      SOURCE_URL: ${{ github.event.inputs.source_url || 'https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git' }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || '25.12' }}
      DEVICE: cmcc_xr30-nand-mtkuboot
      FEED_REPO: https://github.com/kenzok8/openwrt-daede.git

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget ccache

      - name: 克隆 OpenWrt 源码
        run: |
          echo "源码: $SOURCE_URL ($SOURCE_REF)"
          git clone --depth 1 --branch "$SOURCE_REF" "$SOURCE_URL" openwrt
          cd openwrt
          git log -1 --format='源码 HEAD: %H%n提交信息: %s'

      - name: 附加自定义包 kenzok-daed
        run: |
          mkdir -p openwrt/package/custom
          git clone --depth 1 "$FEED_REPO" openwrt/package/custom/kenzok-daed
          cd openwrt/package/custom/kenzok-daed
          git log -1 --format='feed HEAD: %H %s'
          echo "--- 该 feed 提供的包 ---"
          for mf in $(find . -maxdepth 2 -name Makefile); do
            grep -hE '^PKG_NAME' "$mf" 2>/dev/null || true
          done

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 应用 XR30 配置
        run: |
          cp config/xr30.defconfig openwrt/.config
          cd openwrt
          make defconfig
          echo "--- 校验 ---"
          grep -E '^CONFIG_TARGET_PROFILE=' .config
          grep -E '^CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_xr30-nand-mtkuboot=y$' .config || {
            echo "::error::设备 $DEVICE 未在配置中启用"; exit 1; }
          echo "包总数: $(grep -cE '^CONFIG_PACKAGE_[^=]+=y$' .config)"
          grep -E '^CONFIG_PACKAGE_(daed|luci-app-daede)=y$' .config || true

      - name: 缓存源码包 dl
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-xr30-${{ hashFiles('config/xr30.defconfig') }}
          restore-keys: |
            dl-xr30-

      - name: 下载依赖源码包
        run: |
          cd openwrt
          make download -j8 V=s || make download -j1 V=s

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: 收集产物
        run: |
          mkdir -p out
          find openwrt/bin/targets -type f \
            \( -name '*cmcc_xr30-nand-mtkuboot*.bin' \
            -o -name 'profiles.json' \
            -o -name 'config.buildinfo' \
            -o -name 'feeds.buildinfo' \
            -o -name 'version.buildinfo' \) \
            -exec cp -v {} out/ \;
          echo "--- 产物清单 ---"
          ls -lh out/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: xr30-firmware-run${{ github.run_number }}
          path: out/
          retention-days: 30
          if-no-files-found: error

      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
