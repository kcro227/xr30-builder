name: Build XR30 Firmware

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "OpenWrt 源码仓库地址"
        required: false
        default: "https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git"
      source_ref:
        description: "源码分支或标签"
        required: false
        default: "25.12"
      variants:
        description: "要构建的版本（all / daed-qmodem / openclash-qmodem / full）"
        required: false
        default: "all"
  push:
    branches: [main]
    paths:
      - "config/**"
      - ".github/workflows/**"
  schedule:
    - cron: "0 18 * * 5"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        run: |
          ALL='{"include":[
            {"name":"daed-qmodem","label":"daed + qmodem","feeds":"kenzok-daed qmodem","fragments":"qmodem daed","expect":"daed,luci-app-daede,luci-app-qmodem"},
            {"name":"openclash-qmodem","label":"openclash + qmodem","feeds":"openclash qmodem","fragments":"qmodem openclash","expect":"luci-app-openclash,luci-app-qmodem"},
            {"name":"full","label":"daed + openclash + qmodem + 常用插件","feeds":"kenzok-daed openclash qmodem","fragments":"qmodem daed openclash common-apps","expect":"daed,luci-app-daede,luci-app-openclash,luci-app-qmodem"}
          ]}'
          SEL='${{ github.event.inputs.variants }}'
          if [ -z "$SEL" ] || [ "$SEL" = "all" ]; then
            echo "matrix=$ALL" >> "$GITHUB_OUTPUT"
            echo "构建全部 3 个版本"
          else
            case "$SEL" in
              daed-qmodem)
                M='{"include":[{"name":"daed-qmodem","label":"daed + qmodem","feeds":"kenzok-daed qmodem","fragments":"qmodem daed","expect":"daed,luci-app-daede,luci-app-qmodem"}]}' ;;
              openclash-qmodem)
                M='{"include":[{"name":"openclash-qmodem","label":"openclash + qmodem","feeds":"openclash qmodem","fragments":"qmodem openclash","expect":"luci-app-openclash,luci-app-qmodem"}]}' ;;
              full)
                M='{"include":[{"name":"full","label":"daed + openclash + qmodem + 常用插件","feeds":"kenzok-daed openclash qmodem","fragments":"qmodem daed openclash common-apps","expect":"daed,luci-app-daede,luci-app-openclash,luci-app-qmodem"}]}' ;;
              *)
                echo "::error::未知版本: $SEL"; exit 1 ;;
            esac
            echo "matrix=$M" >> "$GITHUB_OUTPUT"
            echo "构建单个版本: $SEL"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    concurrency:
      group: build-xr30-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      SOURCE_URL: ${{ github.event.inputs.source_url || 'https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git' }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || '25.12' }}
      DEVICE: cmcc_xr30-nand-mtkuboot
    name: ${{ matrix.name }} (${{ matrix.label }})

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget ccache

      - name: 克隆 OpenWrt 源码
        run: |
          echo "源码: $SOURCE_URL ($SOURCE_REF)"
          git clone --depth 1 --branch "$SOURCE_REF" "$SOURCE_URL" openwrt
          git -C openwrt log -1 --format='源码 HEAD: %H%n提交信息: %s'

      - name: 附加自定义包
        run: |
          declare -A URLS=(
            [kenzok-daed]="https://github.com/kenzok8/openwrt-daede.git"
            [openclash]="https://github.com/vernesong/OpenClash.git"
            [qmodem]="https://github.com/FuJr/QModem.git"
          )
          mkdir -p openwrt/package/custom
          for f in ${{ matrix.feeds }}; do
            echo ">>> 克隆 $f"
            git clone --depth 1 "${URLS[$f]}" "openwrt/package/custom/$f"
            git -C "openwrt/package/custom/$f" log -1 --format="    HEAD: %h %s"
          done

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置（基线 + 片段）
        run: |
          cp config/xr30.defconfig openwrt/.config
          for f in ${{ matrix.fragments }}; do
            echo ">>> 叠加片段: $f"
            grep -vE '^\s*#' "config/fragments/$f.config" | grep -vE '^\s*$' >> openwrt/.config
          done
          cd openwrt
          make defconfig
          echo "--- 设备 ---"
          grep -E '^CONFIG_TARGET_PROFILE=' .config
          grep -qE '^CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_xr30-nand-mtkuboot=y$' .config || {
            echo "::error::设备 $DEVICE 未启用"; exit 1; }
          echo "包总数: $(grep -cE '^CONFIG_PACKAGE_[^=]+=y$' .config)"

      - name: 校验关键插件
        run: |
          cd openwrt
          MISSING=""
          for p in $(echo "${{ matrix.expect }}" | tr ',' ' '); do
            if grep -qE "^CONFIG_PACKAGE_${p}=y$" .config; then
              echo "  ✅ $p"
            else
              echo "  ❌ $p"; MISSING="$MISSING $p"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::以下关键插件未被启用:$MISSING"
            exit 1
          fi

      - name: 缓存源码包 dl
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-xr30-${{ matrix.name }}-${{ hashFiles('config/xr30.defconfig', 'config/fragments/*.config') }}
          restore-keys: |
            dl-xr30-${{ matrix.name }}-
            dl-xr30-

      - name: 下载依赖源码包
        run: |
          cd openwrt
          make download -j8 V=s || make download -j1 V=s

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: 收集产物
        run: |
          mkdir -p "out/${{ matrix.name }}"
          find openwrt/bin/targets -type f \
            \( -name '*cmcc_xr30-nand-mtkuboot*.bin' \
            -o -name 'profiles.json' \
            -o -name 'config.buildinfo' \
            -o -name 'feeds.buildinfo' \
            -o -name 'version.buildinfo' \) \
            -exec cp -v {} "out/${{ matrix.name }}/" \;
          echo "--- 产物清单 ---"
          ls -lh "out/${{ matrix.name }}/"

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: xr30-${{ matrix.name }}-run${{ github.run_number }}
          path: out/${{ matrix.name }}/
          retention-days: 30
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: xr30-*
          merge-multiple: false

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          generate_release_notes: true
